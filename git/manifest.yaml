manifestVersion: 1
name: "@swamp/git"
version: "2026.09.15.1"
description: |
  Git repository operations for swamp workflows. Wraps the git CLI
  and returns structured data (file lists, commit objects, status
  entries) instead of raw text, making git operations composable
  in swamp workflows.

  Designed for CI automation: change detection via diff, dirty-tree
  checks via status, push/sync verification via upstream_state, bot
  commits, and branch management.

  ## Methods

  | Method   | What it does |
  | -------- | ------------ |
  | `clone`  | Clone a repository with configurable depth, branch, and auth. |
  | `diff`   | Show changes between refs — name-only file lists, stat summaries, or full diffs. |
  | `worktree_diff` | Read-only working-tree diff — staged, unstaged, and untracked changes vs a base ref. |
  | `status` | Working tree status with structured entries and clean/dirty flag. |
  | `remote_ref` | Look up the SHA of a named ref on a remote via git ls-remote (read-only). |
  | `upstream_state` | Tracking-branch state: configured upstream, tracking-ref availability, ahead/behind counts, pushed/synced flags. |
  | `is_ancestor` | Check if one commit is an ancestor of another (read-only, via git merge-base --is-ancestor). |
  | `log`    | Commit history with structured entries (SHA, author, date, message). |
  | `commit` | Stage files and create a commit, optionally at a chosen author/committer date. |
  | `amend`  | Amend the most recent commit — rewrite message, staged content, and/or dates. Records old and new SHA. |
  | `push`   | Push commits to a remote (with optional force, force-with-lease, and set-upstream). |
  | `pull`   | Pull changes from a remote (with optional rebase and ff-only). |
  | `fetch`  | Fetch refs from a remote with optional tag and prune support. |
  | `cherry_pick` | Cherry-pick commits or abort an in-progress cherry-pick. |
  | `branch` | Create, switch, or list branches (supports orphan branch creation). |
  | `config` | Get or set git configuration values. |
  | `remove_worktree` | Safely remove a registered clean secondary worktree — refuses the primary checkout and dirty worktrees. |

  ## Usage

  ```bash
  swamp extension pull @swamp/git

  swamp model create @swamp/git repo
  swamp model edit repo

  swamp model method run repo diff \
    --input base=HEAD~1 \
    --input nameOnly=true \
    --input 'paths:json=["*/manifest.yaml"]' \
    --json
  ```
repository: "https://github.com/swamp-club/swamp-extensions"
models:
  - git.ts
additionalFiles:
  - LICENSE.txt
  - README.md
platforms: []
labels:
  - git
